# One control node and two workers on their own network (plan/02, D02.15).
#
#   docker compose -f docker/compose.yaml up -d --build
#   docker compose -f docker/compose.yaml down

name: dpes

x-worker: &worker
  image: dpes:dev
  init: true  # reaps the orphans of killed task process groups (D07.19)
  shm_size: 1gb
  networks: [cluster]
  # This is the test and demonstration cluster: tasks may ask for injected
  # faults (plan/09, D09.7). A production deployment would leave it unset.
  environment:
    DPES_FAULT_INJECTION: "1"
  depends_on:
    head:
      condition: service_healthy

services:
  head:
    image: dpes:dev
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: dpes-head
    hostname: head
    init: true
    # Ray would fold log lines that differ only in numbers, and execution ids
    # are full of numbers (plan/10, D10.7).
    environment:
      RAY_DEDUP_LOGS: "0"
    shm_size: 1gb
    networks: [cluster]
    # The gateway is the only published port, and only on this machine
    # (plan/07, D07.18).
    ports:
      - "127.0.0.1:8000:8000"
    # No CPUs: the control node coordinates, it never runs tasks. Ray starts
    # first, then the gateway takes over as the container's main process.
    command:
      - sh
      - -c
      - >-
        ray start --head --port=6379 --num-cpus=0
        --object-store-memory=200000000 --include-dashboard=false
        && exec python -m dpes.gateway
    healthcheck:
      test: ["CMD", "ray", "status"]
      interval: 5s
      timeout: 10s
      retries: 12

  # Each worker declares a resource with its own name so that a task can be
  # sent to one specific worker (fault experiments, cross-worker artifacts).
  worker-1:
    <<: *worker
    container_name: dpes-worker-1
    hostname: worker-1
    command:
      - ray
      - start
      - --address=head:6379
      - --num-cpus=2
      - --object-store-memory=200000000
      - '--resources={"worker-1": 1}'
      - --block

  worker-2:
    <<: *worker
    container_name: dpes-worker-2
    hostname: worker-2
    command:
      - ray
      - start
      - --address=head:6379
      - --num-cpus=2
      - --object-store-memory=200000000
      - '--resources={"worker-2": 1}'
      - --block

networks:
  cluster: {}
