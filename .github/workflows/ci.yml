name: CI

on: push

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -W error -m unittest discover -s tests/unit

  cluster:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image and start the cluster
        run: docker compose -f docker/compose.yaml up -d --build
      - name: Cut C0, the cluster is up
        run: >
          docker compose -f docker/compose.yaml exec -T head
          python -m unittest discover -s tests/e2e
      - name: Cluster logs
        if: failure()
        run: docker compose -f docker/compose.yaml logs
      - name: Stop the cluster
        if: always()
        run: docker compose -f docker/compose.yaml down
